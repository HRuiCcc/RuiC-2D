<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RuiC-2D · 大肥鱼1号在线体验</title>
<meta name="description" content="在线体验 RuiC-2D：和会眨眼、会说话、会摆尾的大肥鱼1号互动。">
<link rel="icon" href="../public/brand/mark.svg">
<link rel="stylesheet" href="./demo.css">
</head>
<body>
<div class="topbar">
  <a class="brand" href="https://github.com/HRuiCcc/RuiC-2D">
    <img src="../public/brand/mark.svg" alt="" width="30" height="30">
    <b>RuiC-2D</b>
    <span class="pill">ONLINE DEMO</span>
  </a>
  <nav>
    <a href="https://github.com/HRuiCcc/RuiC-2D" target="_blank" rel="noreferrer">GitHub 源码 <span>↗</span></a>
  </nav>
</div>

<main class="shell">
  <section class="stage">
    <div class="stage-glow"></div>
    <div class="stage-card">
      <div class="loading" id="loading"><span class="spinner"></span>正在唤醒大肥鱼…</div>
      <iframe id="avatar-frame" title="大肥鱼1号实时预览" src="../public/player.html?project=da-fei-yu-1&bg=transparent" allow="autoplay"></iframe>
      <div class="stage-meta"><span class="dot"></span>大肥鱼1号 · 浏览器本地渲染</div>
    </div>
  </section>

  <section class="intro">
    <p class="eyebrow">LIVE 2D AVATAR</p>
    <h1>你好，<br>我叫<span>大肥鱼</span>。</h1>
    <p class="lede">点一下让她开口说话。也可以试试眨眼、转头和摆尾——所有动作都在你的浏览器里实时生成。</p>

    <div class="actions">
      <button id="play" class="primary" aria-pressed="false">
        <span class="icon" id="play-icon" aria-hidden="true">▶</span>
        <span id="play-label">播放自我介绍</span>
      </button>
      <span class="hint">曼波音色 · 1.1× · 12.9s</span>
    </div>

    <div class="chips" role="group" aria-label="动作">
      <button data-action="blink">眨眼</button>
      <button data-action="turn">转头</button>
      <button data-action="tail">摆尾</button>
      <button data-action="closed">闭眼</button>
      <button data-action="smile">开心</button>
    </div>

    <p class="note">这是静态体验页：动作、口型和声音都在本地运行，不上传。完整编辑器需要克隆仓库后启动本地服务。</p>

    <a class="ghost" href="https://github.com/HRuiCcc/RuiC-2D" target="_blank" rel="noreferrer">查看源码 / 本地运行 <span>↗</span></a>
  </section>
</main>

<footer class="foot">
  <span>RuiC-2D · MIT License</span>
  <span>角色素材 © 作者 · 仅作演示</span>
</footer>

<script type="module" src="./demo.js"></script>
</body>
</html>
