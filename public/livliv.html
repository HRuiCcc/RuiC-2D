<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LivLiv 角色库 · RuiC-2D</title>
<link rel="icon" type="image/svg+xml" href="/brand/mark.svg">
<link rel="stylesheet" href="/livliv.css">
<script type="importmap">{ "imports": { "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.1.1/vision_bundle.mjs" } }</script>
</head>
<body>
<header class="lv-bar">
  <a class="lv-back" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>返回工作台</a>
  <div class="lv-mark"><img src="/brand/mark.svg" alt=""><b>LivLiv 角色库</b><span>21 位精选角色 · 直接开演</span></div>
  <div class="lv-actions">
    <button id="lv-mic" title="麦克风驱动口型"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg><span>麦克风</span></button>
    <button id="lv-cam" title="摄像头面部追踪"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3Z"/><circle cx="12" cy="13" r="3"/></svg><span>摄像头</span></button>
    <span class="divider"></span>
    <button id="lv-bg" title="切换预览背景"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="m3 15 5-5 4 4 3-3 6 6"/><circle cx="9" cy="8" r="1.4"/></svg><span>背景</span></button>
    <button id="lv-obs" title="OBS 浏览器源地址"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg><span>OBS</span></button>
    <button id="lv-shot" title="保存当前画面 PNG"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 8a2 2 0 0 1 2-2h2l2-2h6l2 2h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><circle cx="12" cy="12.5" r="3.2"/></svg><span>截图</span></button>
    <button id="lv-reset" title="回到全身视野"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 9V5a2 2 0 0 1 2-2h4"/><path d="M21 9V5a2 2 0 0 0-2-2h-4"/><path d="M3 15v4a2 2 0 0 0 2 2h4"/><path d="M21 15v4a2 2 0 0 1-2 2h-4"/></svg><span>回正</span></button>
  </div>
</header>

<main class="lv-main">
  <aside class="lv-side">
    <div class="lv-side-head"><h2>角色</h2><span id="lv-count">载入中…</span></div>
    <label class="lv-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="lv-filter" type="search" placeholder="搜索角色名…" aria-label="搜索角色">
    </label>
    <div class="lv-list" id="lv-list" role="listbox" aria-label="角色列表"></div>
    <div class="lv-side-foot">角色由 LivLiv（livliv.ai）提供，仅限非商业使用，使用时须署名。<a href="/characters/LICENSE.md" target="_blank" rel="noopener">许可</a> · <a href="/characters/CREDITS.md" target="_blank" rel="noopener">来源</a></div>
  </aside>

  <section class="lv-stage" id="lv-stage">
    <canvas id="lv-canvas" aria-label="角色实时预览"></canvas>
    <img id="lv-poster" alt="" aria-hidden="true">
    <iframe id="lv-frame" title="本地工程播放" hidden allow="camera; microphone"></iframe>
    <div class="lv-status" id="lv-status" hidden></div>
    <div class="lv-name"><b id="lv-name">—</b><span id="lv-sub"></span></div>
    <div class="lv-credit">角色：LivLiv（livliv.ai）</div>
    <div class="lv-tray" id="lv-tray">
      <div class="lv-tray-row" id="lv-exprs"></div>
      <div class="lv-tray-row" id="lv-acts"></div>
    </div>
  </section>
</main>

<dialog class="lv-dialog" id="lv-obs-dialog">
  <div class="lv-dialog-head"><h2>OBS 浏览器源地址</h2><button id="lv-obs-close" class="lv-close" aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
  <div class="lv-dialog-body">
    <p>在 OBS 里添加「浏览器」来源，把下面的地址粘进去，宽高建议 1080 × 1080。只有角色、没有界面，背景透明。</p>
    <div class="lv-url"><input id="lv-obs-url" readonly aria-label="OBS 地址"><button id="lv-obs-copy" class="lv-copy">复制</button></div>
    <div class="lv-tip">保存这个页面开着即可。加密后的地址为 <b>chrome=0</b> 表示隐藏全部界面；<b>bg=</b> 可换 transparent / dark / green / white。</div>
  </div>
</dialog>

<script type="module" src="/livliv.js"></script>
</body>
</html>
